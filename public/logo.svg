<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="logoBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Hexagonal outer frame -->
  <polygon points="60,15 105,40 105,90 60,115 15,90 15,40" stroke="url(#logoBluePurple)" stroke-width="3" fill="none" opacity="0.2" />
  <!-- Curved C + N monogram -->
  <path d="M 49 43 C 33 43 33 87 59 87 L 59 43 L 81 87 L 81 43"
        stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Corner dots -->
  <circle cx="60" cy="15" r="4" fill="#f8fafc" />
  <circle cx="105" cy="40" r="4" fill="#f8fafc" />
  <circle cx="105" cy="90" r="4" fill="#f8fafc" />
  <circle cx="60" cy="115" r="4" fill="#f8fafc" />
  <circle cx="15" cy="90" r="4" fill="#f8fafc" />
  <circle cx="15" cy="40" r="4" fill="#f8fafc" />
</svg>
